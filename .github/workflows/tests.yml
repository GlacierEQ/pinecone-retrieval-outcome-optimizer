name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt build
      - run: python -m pytest -q
      - run: python scripts/operate.py
      - run: python -m build
      - run: pip install dist/*.whl
      - run: retrieval-outcome-replay examples/labeled_outcome_replay.json --incumbent baseline --output /tmp/replay-receipt.json
      - run: python -c 'import json; d=json.load(open("/tmp/replay-receipt.json")); assert d["decision"] == "PROMOTE"; assert d["selected_policy_id"] == "outcome-aware"'
