[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pinecone-retrieval-outcome-optimizer"
version = "0.2.0"
description = "Retrieval outcome optimization, labeled policy replay, and reproducible indexed experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
retrieval-outcome-replay = "outcome_replay_cli:main"
retrieval-outcome-experiment = "retrieval_experiment_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "retrieval_outcome_optimizer",
  "outcome_replay_optimizer",
  "outcome_replay_cli",
  "labeled_corpus",
  "disposable_vector_index",
  "retrieval_experiment",
  "retrieval_experiment_cli",
  "promotion_authority"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
